{% extends 'base.html' %} {% block title %} QS University - Applications {%
endblock %} {% block content %}
<style>
  /* Your existing styles */
</style>
<h1>Applications</h1>

<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Applications Overview</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table
              id="applicationsTable"
              class="table table-striped table-bordered table-hover"
              style="width: 100%"
            >
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th>User</th>
                  <th>Submitted At</th>
                  <th>Created At</th>
                  <th>Updated At</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    // Add search inputs to each column footer
    $("#applicationsTable thead tr")
      .clone(true)
      .appendTo("#applicationsTable thead");
    $("#applicationsTable thead tr:eq(1) th").each(function (i) {
      $(this).html(
        '<input type="text" class="form-control form-control-sm" placeholder="Search" />'
      );
      $("input", this).on("keyup change", function () {
        if (table.column(i).search() !== this.value) {
          table.column(i).search(this.value).draw();
        }
      });
    });

    var table = $("#applicationsTable").DataTable({
      ajax: {
        url: "http://localhost:8000/api/applications",
        method: "GET",
        dataSrc: "results",
      },
      orderCellsTop: true,
      fixedHeader: true,
      columns: [
        { data: "id" },
        {
          data: "name",
          render: function (data, type, row) {
            if (type === "display") {
              return `<a href="/applications/${row.id}">${data}</a>`;
            }
            return data;
          },
        },
        { data: "description" },
        { data: "user" },
        {
          data: "submitted_at",
          render: function (data) {
            return new Date(data).toLocaleDateString();
          },
        },
        {
          data: "created_at",
          render: function (data) {
            return new Date(data).toLocaleDateString();
          },
        },
        {
          data: "updated_at",
          render: function (data) {
            return new Date(data).toLocaleDateString();
          },
        },
      ],
      search: {
        smart: true,
      },
    });
  });
</script>

{% endblock %}
